name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Cache-busting (новая версия файлов при каждой публикации)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(static/[A-Za-z0-9_.-]+\.(js|css))\?v=[A-Za-z0-9]+#\1?v=$V#g" public/index.html
          sed -i -E "s#window\.WSPORT_BUILD = '[^']*'#window.WSPORT_BUILD = '$V'#" public/index.html
          grep -o 'v=[A-Za-z0-9]*' public/index.html | sort | uniq -c

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
